<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent</title>
  <style>
    :root {
      --bg: light-dark(#ffffff, #0d1220);
      --bg-soft: light-dark(#f6f7f9, #111827);
      --text: light-dark(#14161c, #e8edf5);
      --text-soft: light-dark(#5c6470, #8b96a8);
      --border: light-dark(#e4e7eb, #1e2a3f);
      --accent: light-dark(#0b8f68, #2ee6a8);
      --accent-ink: light-dark(#ffffff, #06251a);
      --you: light-dark(#0b72d1, #1c3f63);
      --live: #1a9c5b;
      --err: #c2372f;
      --amber: #a06a12;
      color-scheme: light dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }
    header .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--text-soft); flex: 0 0 auto;
    }
    header .dot.live { background: var(--live); box-shadow: 0 0 8px rgba(26, 156, 91, 0.8); }
    header .dot.err  { background: var(--err); }
    header h1 { font-size: 14.5px; font-weight: 800; flex: 1; }
    header .status { font-size: 12px; color: var(--text-soft); }
    header .mode {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
      color: var(--text-soft); cursor: help;
    }
    header .mode.grant { color: var(--accent); border-color: var(--accent); }
    header .mode.fallback-key { color: var(--amber); border-color: var(--amber); }

    #screen {
      flex: 1 1 auto;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 18px; overflow-y: auto;
    }
    #mic {
      width: 84px; height: 84px;
      border-radius: 50%; border: none;
      background: var(--accent); color: var(--accent-ink);
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(26, 156, 91, 0.35);
      transition: transform 0.1s ease;
    }
    #mic:hover { transform: scale(1.04); }
    #mic:disabled { opacity: 0.6; cursor: default; transform: none; }
    #mic .sub { display: block; font-size: 10.5px; font-weight: 700; margin-top: 2px; }
    #capOnly {
      border: 1px solid var(--border); background: transparent; color: var(--text-soft);
      border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 12.5px;
      font-weight: 600; cursor: pointer;
    }
    #capOnly:hover { color: var(--text); border-color: var(--text-soft); }
    #hint { color: var(--text-soft); font-size: 12.5px; text-align: center; max-width: 280px; }
    #err { color: var(--err); font-size: 12.5px; text-align: center; max-width: 280px; display: none; }

    #live { display: none; flex: 1 1 auto; flex-direction: column; min-height: 0; }
    #transcript {
      flex: 1 1 auto;
      overflow-y: auto; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 0; font-size: 14px;
    }
    .final { padding: 7px 11px; border-radius: 11px; background: var(--bg-soft); border: 1px solid var(--border); }
    .final .t { font-size: 10px; color: var(--text-soft); font-family: ui-monospace, Menlo, Consolas, monospace; display: block; margin-bottom: 1px; }
    .interim { color: var(--text-soft); font-style: italic; padding: 0 11px; }
    .interim::after { content: "▍"; color: var(--accent); animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .line { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 13.5px; }
    .line .who {
      display: block; font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 2px; color: var(--text-soft);
    }
    .line.you {
      align-self: flex-end;
      background: var(--you); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .line.agent {
      align-self: flex-start;
      background: var(--bg-soft); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .meter { flex: 0 0 auto; height: 3px; background: var(--bg-soft); margin: 0 14px; border-radius: 999px; overflow: hidden; }
    .meter > i { display: block; height: 100%; width: 0%; background: var(--live); transition: width 0.09s linear; }

    footer {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }
    footer .stats { font-size: 11.5px; color: var(--text-soft); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #stop {
      border: 1px solid var(--err); color: var(--err);
      background: transparent; border-radius: 8px;
      padding: 6px 14px; font: inherit; font-weight: 700; cursor: pointer;
      flex: 0 0 auto;
    }
    .fade { animation: fade 0.2s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Voice Agent</h1>
    <span class="mode" id="mode" hidden></span>
    <span class="status" id="status">Ready</span>
  </header>

  <div id="screen">
    <button id="mic" title="Talk to the agent">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="margin-bottom:-4px"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
      <span class="sub" id="micLabel">Talk</span>
    </button>
    <p id="hint">One click and the agent is live: it hears you (Nova-3), thinks
       (gpt-4o-mini, managed by Deepgram) and answers out loud (Aura-2 voice).
       Your audio goes straight from this browser to Deepgram — only text
       renders in the session.</p>
    <button id="capOnly" title="Live captions without the agent">captions only</button>
    <p id="err"></p>
  </div>

  <div id="live">
    <div id="transcript"></div>
    <div class="meter"><i id="level"></i></div>
    <footer>
      <span class="stats" id="stats"></span>
      <button id="stop" title="End the conversation">Stop</button>
    </footer>
  </div>

  <script src="./popup.js"></script>
</body>
</html>
